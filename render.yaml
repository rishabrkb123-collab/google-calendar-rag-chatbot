services:
  - type: web
    name: google-calendar-rag-chatbot
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: "pip install -r backend/requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "20"
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OLLAMA_BASE_URL
        value: "https://ollama.com"
      - key: OLLAMA_CHAT_MODEL
        value: "gpt-oss:20b-cloud"
      - key: OLLAMA_API_KEY
        sync: false
      - key: SESSION_HTTPS_ONLY
        value: "true"
